<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GPK ULTRA 3D | Mobile AR Experience</title>
    
    <!-- WebXR and PWA meta tags -->
    <meta name="theme-color" content="#1a1a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GPK Ultra 3D">
    <meta name="description" content="GPK Ultra 3D - Physical Mobile VR Experience">
    
    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- Essential Components -->
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
    <script src="https://unpkg.com/aframe-layout-component@5.3.0/dist/aframe-layout-component.min.js"></script>
    <script src="https://unpkg.com/aframe-animation-component@5.1.2/dist/aframe-animation-component.min.js"></script>
    
    <style>
        :root {
            --gpk-red: #ff3e41;
            --gpk-yellow: #ffde37;
            --gpk-blue: #2e86ab;
            --gpk-black: #1a1a1a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100vw;
            height: 100vh;
            font-family: 'Bangers', cursive, sans-serif;
        }

        /* Minimal Loading */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--gpk-yellow);
            animation: spin 1s linear infinite;
        }
        
        .loading-text {
            color: var(--gpk-yellow);
            margin-top: 1rem;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        /* Proximity Info - Shows when near interactive elements */
        #proximity-indicator {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--gpk-yellow);
            color: var(--gpk-yellow);
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 1000;
            display: none;
            text-align: center;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: pulse 2s infinite;
        }
        
        #proximity-indicator.active {
            display: block;
        }

        /* Tap to Start Overlay */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.3s ease;
        }
        
        #start-overlay h1 {
            color: var(--gpk-yellow);
            font-size: 2rem;
            margin-bottom: 1rem;
            text-shadow: 3px 3px 0 var(--gpk-red);
        }
        
        #start-overlay p {
            color: white;
            font-size: 1.2rem;
            margin-bottom: 2rem;
            text-align: center;
            opacity: 0.8;
        }
        
        #start-btn {
            background: var(--gpk-red);
            color: white;
            border: 3px solid var(--gpk-yellow);
            padding: 15px 40px;
            border-radius: 30px;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            letter-spacing: 2px;
        }

        /* Orientation Hint */
        #orientation-hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            z-index: 1000;
            font-size: 0.8rem;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loading -->
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">GPK ULTRA 3D</div>
    </div>

    <!-- Start Overlay -->
    <div id="start-overlay">
        <h1>GPK ULTRA 3D</h1>
        <p>📱 Hold your phone up<br>🔄 Look around by moving<br>🚶 Walk to explore<br>👆 Tap to interact</p>
        <button id="start-btn">ENTER EXPERIENCE</button>
    </div>

    <!-- Proximity Indicator -->
    <div id="proximity-indicator">
        <span id="proximity-text">Walk closer to interact</span>
    </div>

    <!-- Orientation Hint -->
    <div id="orientation-hint">↔️ Rotate phone to landscape</div>

    <!-- A-Frame Scene - Pure Mobile VR -->
    <a-scene 
        renderer="colorManagement: true; antialias: false; precision: low; alpha: false; logarithmicDepthBuffer: true"
        background="color: #1a1a1a"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: true"
        embedded
    >
        <!-- Main Environment - Scaled for walking exploration -->
        <a-entity geometry="primitive: box; width: 30; height: 6; depth: 30"
                 material="shader: standard; color: #2a2a2a; side: back"
                 position="0 3 0">
        </a-entity>
        
        <!-- Floor with Grid Pattern for Spatial Awareness -->
        <a-entity geometry="primitive: plane; width: 30; height: 30"
                 rotation="-90 0 0"
                 position="0 0 0"
                 material="shader: standard; color: #1a1a1a; metalness: 0.1; roughness: 0.6">
        </a-entity>
        
        <!-- Floor Grid Lines for Depth Perception -->
        <a-entity position="0 0.01 0">
            <!-- Grid lines every 2 meters -->
            <a-entity geometry="primitive: plane; width: 30; height: 0.05"
                     rotation="-90 0 0"
                     position="0 0.01 -4"
                     material="shader: standard; color: #333; emissive: #333; emissiveIntensity: 0.5">
            </a-entity>
            <a-entity geometry="primitive: plane; width: 30; height: 0.05"
                     rotation="-90 0 0"
                     position="0 0.01 0"
                     material="shader: standard; color: #333; emissive: #333; emissiveIntensity: 0.5">
            </a-entity>
            <a-entity geometry="primitive: plane; width: 30; height: 0.05"
                     rotation="-90 0 0"
                     position="0 0.01 4"
                     material="shader: standard; color: #333; emissive: #333; emissiveIntensity: 0.5">
            </a-entity>
        </a-entity>
        
        <!-- Lighting -->
        <a-entity light="type: ambient; color: #666; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; color: #FFDE37; intensity: 1.0" position="-5 5 0"></a-entity>
        <a-entity light="type: point; color: #ffde37; intensity: 2; distance: 20" position="0 4 -5"></a-entity>
        
        <!-- Mobile Camera - Device Orientation Only, No Controls -->
        <a-entity camera="active: true; fov: 70; near: 0.1; far: 50"
                 look-controls="magicWindowTrackingEnabled: true; touchEnabled: false; mouseEnabled: false"
                 wasd-controls-enabled="false"
                 id="mobile-camera"
                 position="0 1.6 3">
            <!-- Simple Gaze Cursor -->
            <a-entity cursor="fuse: true; fuseTimeout: 1000"
                     position="0 0 -1"
                     geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
                     material="color: #FFDE37; shader: flat; opacity: 0.8">
            </a-entity>
        </a-entity>
        
        <!-- Interactive Zones - Positioned for walking exploration -->
        
        <!-- Zone 1: Vintage Collection (Left side, far) -->
        <a-entity id="zone-vintage" class="interaction-zone" zone-type="vintage"
                 position="-4 2 -6"
                 geometry="primitive: box; width: 2; height: 2; depth: 0.2"
                 material="shader: standard; color: #333; metalness: 0.2; roughness: 0.5; transparent: true; opacity: 0.9">
            <a-text value="VINTAGE\nCOLLECTION" position="0 0.8 0.11" color="#FFDE37" align="center" width="2.5"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            <a-text value="1985 Series" position="0 -0.8 0.11" color="#FFFFFF" align="center" width="2.5"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            <!-- Proximity Glow -->
            <a-entity geometry="primitive: box; width: 3; height: 3; depth: 0.3"
                     position="0 0 -0.1"
                     material="shader: standard; color: #FFDE37; transparent: true; opacity: 0.1; emissive: #FFDE37; emissiveIntensity: 0.2"
                     class="proximity-glow">
            </a-entity>
        </a-entity>
        
        <!-- Zone 2: Modern Series (Right side, far) -->
        <a-entity id="zone-modern" class="interaction-zone" zone-type="modern"
                 position="4 2 -6"
                 geometry="primitive: box; width: 2; height: 2; depth: 0.2"
                 material="shader: standard; color: #333; metalness: 0.2; roughness: 0.5; transparent: true; opacity: 0.9">
            <a-text value="MODERN\nSERIES" position="0 0.8 0.11" color="#FFDE37" align="center" width="2.5"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            <a-text value="2020-Present" position="0 -0.8 0.11" color="#FFFFFF" align="center" width="2.5"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            <a-entity geometry="primitive: box; width: 3; height: 3; depth: 0.3"
                     position="0 0 -0.1"
                     material="shader: standard; color: #FFDE37; transparent: true; opacity: 0.1; emissive: #FFDE37; emissiveIntensity: 0.2"
                     class="proximity-glow">
            </a-entity>
        </a-entity>
        
        <!-- Zone 3: Wacky Packages (Center, far) -->
        <a-entity id="zone-wacky" class="interaction-zone" zone-type="wacky"
                 position="0 4 -6"
                 geometry="primitive: box; width: 2; height: 2; depth: 0.2"
                 material="shader: standard; color: #333; metalness: 0.2; roughness: 0.5; transparent: true; opacity: 0.9">
            <a-text value="WACKY\nPACKAGES" position="0 0.8 0.11" color="#FFDE37" align="center" width="2.5"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            <a-text value="Parody Stickers" position="0 -0.8 0.11" color="#FFFFFF" align="center" width="2.5"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            <a-entity geometry="primitive: box; width: 3; height: 3; depth: 0.3"
                     position="0 0 -0.1"
                     material="shader: standard; color: #FFDE37; transparent: true; opacity: 0.1; emissive: #FFDE37; emissiveIntensity: 0.2"
                     class="proximity-glow">
            </a-entity>
        </a-entity>
        
        <!-- Zone 4: Custom Cards (Left wall, close) -->
        <a-entity id="zone-custom" class="interaction-zone" zone-type="custom"
                 position="-8 2 -2"
                 rotation="0 90 0"
                 geometry="primitive: box; width: 2; height: 2; depth: 0.2"
                 material="shader: standard; color: #333; metalness: 0.2; roughness: 0.5; transparent: true; opacity: 0.9">
            <a-text value="CUSTOM\nCARDS" position="0 0.8 0.11" color="#FFDE37" align="center" width="2.5"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            <a-text value="Fan Creations" position="0 -0.8 0.11" color="#FFFFFF" align="center" width="2.5"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            <a-entity geometry="primitive: box; width: 3; height: 3; depth: 0.3"
                     position="0 0 -0.1"
                     material="shader: standard; color: #FFDE37; transparent: true; opacity: 0.1; emissive: #FFDE37; emissiveIntensity: 0.2"
                     class="proximity-glow">
            </a-entity>
        </a-entity>
        
        <!-- Zone 5: Trading Hub (Right wall, close) -->
        <a-entity id="zone-trading" class="interaction-zone" zone-type="trading"
                 position="8 2 -2"
                 rotation="0 -90 0"
                 geometry="primitive: box; width: 2; height: 2; depth: 0.2"
                 material="shader: standard; color: #333; metalness: 0.2; roughness: 0.5; transparent: true; opacity: 0.9">
            <a-text value="TRADING\nHUB" position="0 0.8 0.11" color="#FFDE37" align="center" width="2.5"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            <a-text value="Swap Cards" position="0 -0.8 0.11" color="#FFFFFF" align="center" width="2.5"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            <a-entity geometry="primitive: box; width: 3; height: 3; depth: 0.3"
                     position="0 0 -0.1"
                     material="shader: standard; color: #FFDE37; transparent: true; opacity: 0.1; emissive: #FFDE37; emissiveIntensity: 0.2"
                     class="proximity-glow">
            </a-entity>
        </a-entity>
        
        <!-- Zone 6: Virtual Packs (Back wall center) -->
        <a-entity id="zone-packs" class="interaction-zone" zone-type="pack-opening"
                 position="0 2 -9.5"
                 geometry="primitive: box; width: 2; height: 2; depth: 0.2"
                 material="shader: standard; color: #333; metalness: 0.2; roughness: 0.5; transparent: true; opacity: 0.9">
            <a-text value="VIRTUAL\nPACKS" position="0 0.8 0.11" color="#FFDE37" align="center" width="2.5"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            <a-text value="Open Packs" position="0 -0.8 0.11" color="#FFFFFF" align="center" width="2.5"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            <a-entity geometry="primitive: box; width: 3; height: 3; depth: 0.3"
                     position="0 0 -0.1"
                     material="shader: standard; color: #FFDE37; transparent: true; opacity: 0.1; emissive: #FFDE37; emissiveIntensity: 0.2"
                     class="proximity-glow">
            </a-entity>
        </a-entity>
        
        <!-- Decorative Elements -->
        <a-text value="GPK ULTRA 3D" position="0 5 -9.4" color="#FFDE37" align="center" width="6"
                font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
                animation="property: position; to: 0 5.2 -9.4; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">
        </a-text>
        
        <!-- Floor Markers for Navigation -->
        <a-entity position="0 0.02 -3">
            <a-circle radius="0.3" material="color: #FFDE37; emissive: #FFDE37; emissiveIntensity: 0.5"></a-circle>
        </a-entity>
        <a-entity position="-4 0.02 -5">
            <a-circle radius="0.3" material="color: #ff3e41; emissive: #ff3e41; emissiveIntensity: 0.5"></a-circle>
        </a-entity>
        <a-entity position="4 0.02 -5">
            <a-circle radius="0.3" material="color: #ff3e41; emissive: #ff3e41; emissiveIntensity: 0.5"></a-circle>
        </a-entity>
    </a-scene>

    <script>
        (function() {
            'use strict';
            
            // Elements
            const loadingScreen = document.getElementById('loading-screen');
            const startOverlay = document.getElementById('start-overlay');
            const startBtn = document.getElementById('start-btn');
            const proximityIndicator = document.getElementById('proximity-indicator');
            const proximityText = document.getElementById('proximity-text');
            const orientationHint = document.getElementById('orientation-hint');
            const scene = document.querySelector('a-scene');
            const camera = document.getElementById('mobile-camera');
            
            // State
            let isStarted = false;
            let currentZone = null;
            let proximityTimeout = null;
            
            // Zone Data
            const zoneData = {
                vintage: {
                    name: "VINTAGE COLLECTION",
                    description: "Original 1985 Series",
                    link: "vintage.html",
                    color: "#FFDE37"
                },
                modern: {
                    name: "MODERN SERIES",
                    description: "2020-Present Cards",
                    link: "modern.html",
                    color: "#ff3e41"
                },
                wacky: {
                    name: "WACKY PACKAGES",
                    description: "Parody Sticker Art",
                    link: "wacky.html",
                    color: "#2e86ab"
                },
                custom: {
                    name: "CUSTOM CARDS",
                    description: "Fan Art Gallery",
                    link: "custom.html",
                    color: "#4caf50"
                },
                trading: {
                    name: "TRADING HUB",
                    description: "Connect & Trade",
                    link: "trading.html",
                    color: "#ff9800"
                },
                "pack-opening": {
                    name: "VIRTUAL PACKS",
                    description: "Open Digital Packs",
                    link: "packs.html",
                    color: "#9c27b0"
                }
            };
            
            // Initialize
            function init() {
                setupStartButton();
                setupProximityDetection();
                setupGazeInteraction();
                setupOrientationMonitoring();
                hideLoadingScreen();
            }
            
            // Start Button
            function setupStartButton() {
                startBtn.addEventListener('click', () => {
                    startOverlay.style.opacity = '0';
                    setTimeout(() => {
                        startOverlay.style.display = 'none';
                        isStarted = true;
                        
                        // Request device orientation permission for iOS
                        if (typeof DeviceOrientationEvent !== 'undefined' && 
                            typeof DeviceOrientationEvent.requestPermission === 'function') {
                            DeviceOrientationEvent.requestPermission()
                                .then(permissionState => {
                                    if (permissionState === 'granted') {
                                        console.log('Device orientation granted');
                                    }
                                })
                                .catch(console.error);
                        }
                    }, 300);
                });
            }
            
            // Proximity Detection - Checks distance between camera and zones
            function setupProximityDetection() {
                const zones = document.querySelectorAll('.interaction-zone');
                const PROXIMITY_THRESHOLD = 3; // meters
                const INTERACTION_THRESHOLD = 1.5; // meters
                
                function checkProximity() {
                    if (!isStarted) return;
                    
                    const cameraPos = camera.getAttribute('position');
                    let closestZone = null;
                    let closestDistance = Infinity;
                    
                    zones.forEach(zone => {
                        const zonePos = zone.getAttribute('position');
                        const distance = calculateDistance(cameraPos, zonePos);
                        
                        // Update zone glow based on distance
                        const glowElements = zone.querySelectorAll('.proximity-glow');
                        glowElements.forEach(glow => {
                            if (distance < PROXIMITY_THRESHOLD) {
                                const opacity = Math.max(0, 0.3 - (distance / PROXIMITY_THRESHOLD) * 0.3);
                                glow.setAttribute('material', 'opacity', opacity);
                                glow.setAttribute('material', 'emissiveIntensity', opacity);
                            } else {
                                glow.setAttribute('material', 'opacity', 0.1);
                                glow.setAttribute('material', 'emissiveIntensity', 0.1);
                            }
                        });
                        
                        if (distance < closestDistance) {
                            closestDistance = distance;
                            closestZone = zone;
                        }
                    });
                    
                    // Update proximity indicator
                    if (closestDistance < INTERACTION_THRESHOLD && closestZone) {
                        const zoneType = closestZone.getAttribute('zone-type');
                        const data = zoneData[zoneType];
                        
                        if (data) {
                            proximityText.textContent = `${data.name} - Stare to enter`;
                            proximityIndicator.classList.add('active');
                            currentZone = zoneType;
                        }
                    } else if (closestDistance < PROXIMITY_THRESHOLD && closestZone) {
                        const zoneType = closestZone.getAttribute('zone-type');
                        const data = zoneData[zoneType];
                        
                        if (data) {
                            proximityText.textContent = `${data.name} - Walk closer`;
                            proximityIndicator.classList.add('active');
                            currentZone = null;
                        }
                    } else {
                        proximityIndicator.classList.remove('active');
                        currentZone = null;
                    }
                }
                
                // Check proximity every 200ms
                setInterval(checkProximity, 200);
            }
            
            // Gaze Interaction - Stare at zone to interact
            function setupGazeInteraction() {
                const zones = document.querySelectorAll('.interaction-zone');
                
                zones.forEach(zone => {
                    zone.addEventListener('click', () => {
                        const zoneType = zone.getAttribute('zone-type');
                        const data = zoneData[zoneType];
                        
                        if (data && currentZone === zoneType) {
                            // Visual feedback
                            const glowElements = zone.querySelectorAll('.proximity-glow');
                            glowElements.forEach(glow => {
                                glow.setAttribute('material', 'opacity', 0.5);
                                glow.setAttribute('material', 'emissiveIntensity', 0.5);
                            });
                            
                            // Show transitioning message
                            proximityText.textContent = `Entering ${data.name}...`;
                            proximityIndicator.classList.add('active');
                            
                            // Navigate after brief delay
                            setTimeout(() => {
                                window.location.href = data.link;
                            }, 500);
                        }
                    });
                });
            }
            
            // Orientation Monitoring
            function setupOrientationMonitoring() {
                function checkOrientation() {
                    if (window.innerWidth < window.innerHeight) {
                        orientationHint.style.display = 'block';
                    } else {
                        orientationHint.style.display = 'none';
                    }
                }
                
                window.addEventListener('orientationchange', () => {
                    setTimeout(checkOrientation, 100);
                });
                
                window.addEventListener('resize', checkOrientation);
                checkOrientation();
                
                // Hide after 5 seconds
                setTimeout(() => {
                    orientationHint.style.opacity = '0';
                    setTimeout(() => {
                        orientationHint.style.display = 'none';
                    }, 1000);
                }, 5000);
            }
            
            // Hide Loading Screen
            function hideLoadingScreen() {
                scene.addEventListener('loaded', () => {
                    setTimeout(() => {
                        loadingScreen.style.opacity = '0';
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                        }, 500);
                    }, 1000);
                });
            }
            
            // Utility: Calculate 3D distance
            function calculateDistance(pos1, pos2) {
                const dx = pos1.x - pos2.x;
                const dy = pos1.y - pos2.y;
                const dz = pos1.z - pos2.z;
                return Math.sqrt(dx * dx + dy * dy + dz * dz);
            }
            
            // Utility: Show temporary message
            function showMessage(text, duration = 3000) {
                proximityText.textContent = text;
                proximityIndicator.classList.add('active');
                
                if (proximityTimeout) clearTimeout(proximityTimeout);
                proximityTimeout = setTimeout(() => {
                    proximityIndicator.classList.remove('active');
                }, duration);
            }
            
            // Handle scene load
            scene.addEventListener('loaded', () => {
                console.log('GPK Ultra 3D Mobile ready');
            });
            
            // Handle errors
            window.addEventListener('error', (e) => {
                if (e.target.tagName === 'IMG' || e.target.tagName === 'AUDIO') {
                    console.warn('Asset failed to load:', e.target.src);
                }
            });
            
            // Initialize when ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
            
        })();
    </script>
</body>
</html>
