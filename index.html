<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GPK ULTRA 3D | Immersive Collector's Hub</title>
    
    <!-- Preload critical resources -->
    <link rel="preload" href="https://aframe.io/releases/1.5.0/aframe.min.js" as="script">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" as="style">
    
    <!-- WebXR and PWA meta tags -->
    <meta name="theme-color" content="#1a1a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GPK Ultra 3D">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="msapplication-TileColor" content="#1a1a1a">
    <meta name="description" content="GPK Ultra 3D - Mobile-optimized Garbage Pail Kids Collector's Experience">
    
    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- A-Frame Components -->
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
    <script src="https://unpkg.com/aframe-layout-component@5.3.0/dist/aframe-layout-component.min.js"></script>
    <script src="https://unpkg.com/aframe-animation-component@5.1.2/dist/aframe-animation-component.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
        :root {
            --gpk-red: #ff3e41;
            --gpk-yellow: #ffde37;
            --gpk-blue: #2e86ab;
            --gpk-black: #1a1a1a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Bangers', 'Comic Sans MS', cursive, sans-serif;
            background-color: var(--gpk-black);
            color: white;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--gpk-yellow);
            border-right-color: var(--gpk-red);
            animation: spin 1.2s linear infinite;
        }
        
        .loading-text {
            margin-top: 1rem;
            font-size: 1.2rem;
            text-shadow: 0 0 15px var(--gpk-yellow);
            letter-spacing: 2px;
        }

        /* Mobile Controls Overlay */
        #mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .mobile-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(26, 26, 26, 0.9);
            border: 2px solid var(--gpk-yellow);
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        .mobile-btn:active {
            background: var(--gpk-yellow);
            color: var(--gpk-black);
            transform: scale(0.95);
        }
        
        .mobile-btn.vr-btn {
            width: 60px;
            height: 60px;
            font-size: 1.8rem;
            background: var(--gpk-red);
            border-color: var(--gpk-red);
            animation: pulse 2s infinite;
        }
        
        .joystick-area {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            background: rgba(26, 26, 26, 0.5);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            touch-action: manipulation;
        }

        /* VR Mode Button */
        #enter-vr-btn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            background: var(--gpk-red);
            color: white;
            border: 3px solid var(--gpk-yellow);
            padding: 20px 40px;
            border-radius: 30px;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            display: none;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: pulse 2s infinite;
        }
        
        #enter-vr-btn.show {
            display: block;
        }

        /* Screen Info Panel */
        .screen-info {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 26, 0.95);
            padding: 15px 25px;
            border-radius: 20px;
            border: 2px solid var(--gpk-yellow);
            z-index: 999;
            display: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            max-width: 90vw;
            text-align: center;
        }
        
        .screen-info.active {
            display: block;
            animation: slideUp 0.3s ease;
        }

        /* Orientation Warning */
        #orientation-warning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10001;
            flex-direction: column;
        }
        
        #orientation-warning.show {
            display: flex;
        }
        
        #orientation-warning .rotate-icon {
            font-size: 4rem;
            animation: rotate 2s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media (max-width: 768px) {
            .mobile-btn {
                width: 44px;
                height: 44px;
                font-size: 1.3rem;
            }
            
            .mobile-btn.vr-btn {
                width: 54px;
                height: 54px;
                font-size: 1.6rem;
            }
            
            .joystick-area {
                width: 100px;
                height: 100px;
                bottom: 15px;
                left: 15px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">LOADING GPK ULTRA 3D...</div>
    </div>

    <!-- Orientation Warning -->
    <div id="orientation-warning">
        <div class="rotate-icon">📱</div>
        <h2 style="color: var(--gpk-yellow); margin-top: 20px;">PLEASE ROTATE YOUR DEVICE</h2>
        <p style="margin-top: 10px; opacity: 0.8;">Landscape mode recommended for best experience</p>
    </div>

    <!-- Enter VR Button -->
    <button id="enter-vr-btn">🥽 ENTER VR MODE</button>

    <!-- Screen Info Panel -->
    <div id="screen-info" class="screen-info">
        <h3 id="screen-title" style="color: var(--gpk-yellow);"></h3>
        <p id="screen-description"></p>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <button class="mobile-btn" id="look-up">↑</button>
        <button class="mobile-btn" id="move-forward">▲</button>
        <button class="mobile-btn" id="look-right">→</button>
        <button class="mobile-btn vr-btn" id="mobile-vr-btn">👓</button>
        <button class="mobile-btn" id="move-backward">▼</button>
        <button class="mobile-btn" id="look-left">←</button>
        <button class="mobile-btn" id="look-down">↓</button>
    </div>

    <!-- Virtual Joystick Area -->
    <div class="joystick-area" id="joystick-area"></div>

    <!-- A-Frame Scene with Mobile-Optimized Settings -->
    <a-scene 
        renderer="colorManagement: true; antialias: true; precision: medium; alpha: false"
        background="color: #1a1a1a"
        vr-mode-ui="enabled: true; cardboardModeEnabled: true"
        device-orientation-permission-ui="enabled: true"
        ar-mode-ui="enabled: true"
        embedded
    >
        <!-- Room Environment -->
        <a-entity geometry="primitive: box; width: 20; height: 8; depth: 20"
                 material="shader: standard; color: #2a2a2a; metalness: 0.1; roughness: 0.8; side: back"
                 position="0 4 0">
        </a-entity>
        
        <!-- Floor -->
        <a-entity geometry="primitive: plane; width: 20; height: 20"
                 rotation="-90 0 0"
                 material="shader: standard; color: #1a1a1a; metalness: 0.2; roughness: 0.5">
        </a-entity>
        
        <!-- Ceiling -->
        <a-entity geometry="primitive: plane; width: 20; height: 20"
                 rotation="90 0 0"
                 position="0 8 0"
                 material="shader: standard; color: #151515; metalness: 0.05; roughness: 0.9">
        </a-entity>
        
        <!-- Walls -->
        <a-entity geometry="primitive: plane; width: 20; height: 8"
                 position="0 4 -10"
                 material="shader: standard; color: #252525">
        </a-entity>
        
        <a-entity geometry="primitive: plane; width: 20; height: 8"
                 position="-10 4 0"
                 rotation="0 90 0"
                 material="shader: standard; color: #252525">
        </a-entity>
        
        <a-entity geometry="primitive: plane; width: 20; height: 8"
                 position="10 4 0"
                 rotation="0 -90 0"
                 material="shader: standard; color: #252525">
        </a-entity>
        
        <!-- Lighting -->
        <a-entity light="type: ambient; color: #666; intensity: 0.6"></a-entity>
        <a-entity light="type: directional; color: #FFDE37; intensity: 0.8" position="-5 8 5"></a-entity>
        <a-entity light="type: point; color: #ffde37; intensity: 2; distance: 15" position="0 5 -5"></a-entity>
        
        <!-- Mobile-Optimized Camera Rig -->
        <a-entity id="camera-rig" position="0 1.6 2">
            <!-- Desktop Camera -->
            <a-entity camera="active: true; fov: 80; near: 0.1; far: 100"
                     look-controls="pointerLockEnabled: true; touchEnabled: true; magicWindowTrackingEnabled: true; reverseMouseDrag: true"
                     wasd-controls="acceleration: 50; fly: false"
                     id="main-camera">
                <a-entity cursor="fuse: false; fuseTimeout: 500"
                         position="0 0 -1.5"
                         geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                         material="color: #FFDE37; shader: flat">
                </a-entity>
            </a-entity>
            
            <!-- Mobile Touch Camera -->
            <a-entity camera="active: false; fov: 70; near: 0.1; far: 100"
                     id="mobile-camera"
                     look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; reverseMouseDrag: true">
                <a-entity cursor="fuse: true; fuseTimeout: 1500"
                         position="0 0 -1.5"
                         geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                         material="color: #FFDE37; shader: flat">
                </a-entity>
            </a-entity>
        </a-entity>
        
        <!-- Interactive Screens - Row 1 -->
        <a-entity id="screens-row1" layout="type: line; margin: 1.5" position="0 2.2 -9.5" rotation="0 0 0">
            
            <!-- Vintage Collection Screen -->
            <a-entity class="screen" screen-type="vintage" width="2.5" height="1.5">
                <a-plane material="shader: standard; color: #333; metalness: 0.1; roughness: 0.3" 
                         width="2.5" height="1.5"
                         event-set__mouseenter="material.emissive: #FFDE37; material.emissiveIntensity: 0.3"
                         event-set__mouseleave="material.emissive: #000000; material.emissiveIntensity: 0">
                </a-plane>
                <a-text value="VINTAGE\nCOLLECTION" position="0 1.1 0.02" color="#FFDE37" align="center" width="3"
                        font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
                <a-text value="1985 Original Series" position="0 -1.1 0.02" color="#FFFFFF" align="center" width="3"
                        font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            </a-entity>
            
            <!-- Modern Series Screen -->
            <a-entity class="screen" screen-type="modern" width="2.5" height="1.5">
                <a-plane material="shader: standard; color: #333; metalness: 0.1; roughness: 0.3" 
                         width="2.5" height="1.5"
                         event-set__mouseenter="material.emissive: #FFDE37; material.emissiveIntensity: 0.3"
                         event-set__mouseleave="material.emissive: #000000; material.emissiveIntensity: 0">
                </a-plane>
                <a-text value="MODERN\nSERIES" position="0 1.1 0.02" color="#FFDE37" align="center" width="3"
                        font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
                <a-text value="2020-Present" position="0 -1.1 0.02" color="#FFFFFF" align="center" width="3"
                        font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            </a-entity>
            
            <!-- Wacky Packages Screen -->
            <a-entity class="screen" screen-type="wacky" width="2.5" height="1.5">
                <a-plane material="shader: standard; color: #333; metalness: 0.1; roughness: 0.3" 
                         width="2.5" height="1.5"
                         event-set__mouseenter="material.emissive: #FFDE37; material.emissiveIntensity: 0.3"
                         event-set__mouseleave="material.emissive: #000000; material.emissiveIntensity: 0">
                </a-plane>
                <a-text value="WACKY\nPACKAGES" position="0 1.1 0.02" color="#FFDE37" align="center" width="3"
                        font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
                <a-text value="Parody Stickers" position="0 -1.1 0.02" color="#FFFFFF" align="center" width="3"
                        font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            </a-entity>
        </a-entity>
        
        <!-- Second Row of Screens -->
        <a-entity id="screens-row2" layout="type: line; margin: 1.5" position="0 4.5 -9.5" rotation="0 0 0">
            
            <!-- Custom Cards Screen -->
            <a-entity class="screen" screen-type="custom" width="2.5" height="1.5">
                <a-plane material="shader: standard; color: #333; metalness: 0.1; roughness: 0.3" 
                         width="2.5" height="1.5"
                         event-set__mouseenter="material.emissive: #FFDE37; material.emissiveIntensity: 0.3"
                         event-set__mouseleave="material.emissive: #000000; material.emissiveIntensity: 0">
                </a-plane>
                <a-text value="CUSTOM\nCARDS" position="0 1.1 0.02" color="#FFDE37" align="center" width="3"

                <a-text value="Fan Creations" position="0 -1.1 0.02" color="#FFFFFF" align="center" width="3"

            <!-- Trading Hub Screen -->
            <a-entity class="screen" screen-type="trading" width="2.5" height="1.5">

                         event-set__mouseenter="material.emissive: #FFDE37; material.emissiveIntensity: 0.3"
                         event-set__mouseleave="material.emissive: #000000; material.emissiveIntensity: 0">
                </a-plane>
                <a-text value="TRADING\nHUB" position="0 1.1 0.02" color="#FFDE37" align="center" width="3"

                <a-text value="Swap With Collectors" position="0 -1.1 0.02" color="#FFFFFF" align="center" width="3"

            </a-entity>
            
            <!-- Virtual Pack Opening Screen -->
            <a-entity class="screen" screen-type="pack-opening" width="2.5" height="1.5">
                <a-plane material="shader: standard; color: #333; metalness: 0.1; roughness: 0.3" 
                         width="2.5" height="1.5"
                         event-set__mouseenter="material.emissive: #FFDE37; material.emissiveIntensity: 0.3"
                         event-set__mouseleave="material.emissive: #000000; material.emissiveIntensity: 0">
                </a-plane>
                <a-text value="VIRTUAL\nPACKS" position="0 1.1 0.02" color="#FFDE37" align="center" width="3"
                        font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
                <a-text value="Open Digital Packs" position="0 -1.1 0.02" color="#FFFFFF" align="center" width="3"
                        font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false"></a-text>
            </a-entity>
        </a-entity>
        
        <!-- GPK Logo -->
        <a-text value="GPK ULTRA 3D" position="0 7 -9.5" color="#FFDE37" align="center" width="6"
                font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
                animation="property: position; to: 0 7.2 -9.5; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">
        </a-text>
        
        <!-- Display Cases -->
        <a-entity position="-4 1.5 -2" rotation="0 45 0">
            <a-box position="0 0.8 0" width="1.8" height="1" depth="1.2" 
                   material="shader: standard; color: #333; metalness: 0.7; roughness: 0.2">
            </a-box>
            <a-box position="0 2.2 0" width="1.8" height="2.8" depth="1.2"

        <a-entity position="4 1.5 -2" rotation="0 -45 0">
            <a-box position="0 0.8 0" width="1.8" height="1" depth="1.2" 
                   material="shader: standard; color: #333; metalness: 0.7; roughness: 0.2">
            </a-box>
            <a-box position="0 2.2 0" width="1.8" height="2.8" depth="1.2" 
                   material="shader: standard; color: #AAA; opacity: 0.15; transparent: true; metalness: 0.9; roughness: 0.1">
            </a-box>
            <a-text value="LIMITED EDITION" position="0 3.8 0.2" color="#FFDE37" align="center" width="3"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" negate="false">
            </a-text>
        </a-entity>
    </a-scene>

    <script>
        (function() {
            'use strict';
            
            // Detect mobile device
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            
            // DOM Elements
            const loadingScreen = document.getElementById('loading-screen');
            const scene = document.querySelector('a-scene');
            const enterVRBtn = document.getElementById('enter-vr-btn');
            const mobileVRBtn = document.getElementById('mobile-vr-btn');
            const screenInfo = document.getElementById('screen-info');
            const orientationWarning = document.getElementById('orientation-warning');
            
            // Initialize
            function init() {
                setupMobileDetection();
                setupVRHandling();
                setupScreenInteractions();
                setupMobileControls();
                hideLoadingScreen();
                setupOrientationHandling();
            }
            
            // Mobile Detection and Configuration
            function setupMobileDetection() {
                if (isMobile) {
                    // Show mobile controls
                    document.getElementById('mobile-controls').style.display = 'flex';
                    
                    // Configure scene for mobile
                    scene.setAttribute('renderer', 'precision', 'low');
                    scene.setAttribute('renderer', 'antialias', 'false');
                    
                    // Enable touch controls
                    const cameraRig = document.getElementById('camera-rig');
                    if (cameraRig) {
                        cameraRig.setAttribute('movement-controls', 'speed: 0.1');
                    }
                }
            }
            
            // VR Mode Handling
            function setupVRHandling() {
                // Check WebXR support
                function checkVRSupport() {
                    if (navigator.xr) {
                        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                            if (supported) {
                                enterVRBtn.classList.add('show');
                                if (mobileVRBtn) {
                                    mobileVRBtn.style.display = 'block';
                                }
                            }
                        }).catch(() => {
                            console.log('WebXR not supported');
                        });
                    } else if (AFRAME.utils.device.isMobile()) {
                        // Fallback to Cardboard mode for older devices
                        if (mobileVRBtn) {
                            mobileVRBtn.style.display = 'block';
                        }
                    }
                }
                
                // Enter VR button
                enterVRBtn.addEventListener('click', () => {
                    enterVR();
                });
                
                // Mobile VR button
                if (mobileVRBtn) {
                    mobileVRBtn.addEventListener('click', () => {
                        enterVR();
                    });
                }
                
                function enterVR() {
                    if (isMobile) {
                        // For mobile, try cardboard/stereo mode first
                        const camera = document.getElementById('main-camera');
                        if (camera) {
                            camera.setAttribute('stereo', 'eyeSeparation: 0.064');
                        }
                    }
                    
                    // Try to enter VR
                    scene.enterVR().then(() => {
                        console.log('Entered VR mode');
                        enterVRBtn.classList.remove('show');
                    }).catch((err) => {
                        console.error('Failed to enter VR:', err);
                        
                        // Fallback: Show in fullscreen
                        if (document.documentElement.requestFullscreen) {
                            document.documentElement.requestFullscreen();
                        }
                        
                        // For mobile, show orientation warning
                        if (isMobile) {
                            orientationWarning.classList.add('show');
                            setTimeout(() => {
                                orientationWarning.classList.remove('show');
                            }, 3000);
                        }
                    });
                }
                
                // Listen for VR mode changes
                scene.addEventListener('enter-vr', () => {
                    console.log('VR mode active');
                    if (enterVRBtn) enterVRBtn.classList.remove('show');
                });
                
                scene.addEventListener('exit-vr', () => {
                    console.log('VR mode exited');
                    if (isMobile) {
                        enterVRBtn.classList.add('show');
                    }
                });
                
                // Check support after scene loads
                scene.addEventListener('loaded', () => {
                    checkVRSupport();
                });
            }
            
            // Screen Interactions
            function setupScreenInteractions() {
                const screens = document.querySelectorAll('.screen');
                const screenInfo = document.getElementById('screen-info');
                const screenTitle = document.getElementById('screen-title');
                const screenDescription = document.getElementById('screen-description');
                
                const screenData = {
                    vintage: {
                        title: "VINTAGE COLLECTION",
                        description: "Explore original 1985 GPK cards",
                        link: "vintage.html"
                    },
                    modern: {
                        title: "MODERN SERIES",
                        description: "View latest GPK releases",
                        link: "modern.html"
                    },
                    wacky: {
                        title: "WACKY PACKAGES",
                        description: "Parody sticker collection",
                        link: "wacky.html"
                    },
                    custom: {
                        title: "CUSTOM CARDS",
                        description: "Fan-created artwork",
                        link: "custom.html"
                    },
                    trading: {
                        title: "TRADING HUB",
                        description: "Connect with collectors",
                        link: "trading.html"
                    },
                    "pack-opening": {
                        title: "VIRTUAL PACKS",
                        description: "Open digital packs",
                        link: "packs.html"
                    }
                };
                
                screens.forEach(screen => {
                    const screenType = screen.getAttribute('screen-type');
                    
                    screen.addEventListener('click', () => {
                        const data = screenData[screenType];
                        if (data) {
                            screenTitle.textContent = data.title;
                            screenDescription.textContent = data.description;
                            screenInfo.classList.add('active');
                            
                            // Navigate after delay
                            setTimeout(() => {
                                window.location.href = data.link;
                            }, 1000);
                        }
                    });
                    
                    screen.addEventListener('mouseenter', () => {
                        const data = screenData[screenType];
                        if (data) {
                            screenTitle.textContent = data.title;
                            screenDescription.textContent = data.description;
                            screenInfo.classList.add('active');
                        }
                    });
                    
                    screen.addEventListener('mouseleave', () => {
                        screenInfo.classList.remove('active');
                    });
                });
            }
            
            // Mobile Controls
            function setupMobileControls() {
                if (!isMobile) return;
                
                const cameraRig = document.getElementById('camera-rig');
                let moveInterval;
                let moveDirection = null;
                
                // Movement buttons
                const controls = {
                    'move-forward': { position: '0 0 -0.2' },
                    'move-backward': { position: '0 0 0.2' },
                    'look-left': { rotation: '0 -10 0' },
                    'look-right': { rotation: '0 10 0' },
                    'look-up': { rotation: '-10 0 0' },
                    'look-down': { rotation: '10 0 0' }
                };
                
                Object.keys(controls).forEach(id => {
                    const btn = document.getElementById(id);
                    if (!btn) return;
                    
                    btn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        moveDirection = controls[id];
                        startMoving();
                    });
                    
                    btn.addEventListener('touchend', () => {
                        moveDirection = null;
                        stopMoving();
                    });
                    
                    btn.addEventListener('mousedown', () => {
                        moveDirection = controls[id];
                        startMoving();
                    });
                    
                    btn.addEventListener('mouseup', () => {
                        moveDirection = null;
                        stopMoving();
                    });
                });
                
                function startMoving() {
                    if (moveInterval) return;
                    moveInterval = setInterval(() => {
                        if (!moveDirection || !cameraRig) return;
                        
                        if (moveDirection.position) {
                            const pos = cameraRig.getAttribute('position');
                            const [dx, dy, dz] = moveDirection.position.split(' ').map(Number);
                            cameraRig.setAttribute('position', {
                                x: pos.x + dx,
                                y: pos.y + dy,
                                z: pos.z + dz
                            });
                        }
                        
                        if (moveDirection.rotation) {
                            const rot = cameraRig.getAttribute('rotation');
                            const [rx, ry, rz] = moveDirection.rotation.split(' ').map(Number);
                            cameraRig.setAttribute('rotation', {
                                x: rot.x + rx,
                                y: rot.y + ry,
                                z: rot.z + rz
                            });
                        }
                    }, 50);
                }
                
                function stopMoving() {
                    if (moveInterval) {
                        clearInterval(moveInterval);
                        moveInterval = null;
                    }
                }
            }
            
            // Orientation Handling
            function setupOrientationHandling() {
                if (!isMobile) return;
                
                function checkOrientation() {
                    if (window.innerWidth < window.innerHeight) {
                        // Portrait mode
                        orientationWarning.classList.add('show');
                    } else {
                        orientationWarning.classList.remove('show');
                    }
                }
                
                window.addEventListener('orientationchange', () => {
                    setTimeout(checkOrientation, 100);
                });
                
                window.addEventListener('resize', checkOrientation);
                checkOrientation();
            }
            
            // Hide Loading Screen
            function hideLoadingScreen() {
                scene.addEventListener('loaded', () => {
                    setTimeout(() => {
                        loadingScreen.style.opacity = '0';
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                        }, 800);
                    }, 1500);
                });
            }
            
            // Initialize when ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
            
            // Handle scene errors
            scene.addEventListener('renderstart', () => {
                console.log('Scene rendering started');
            });
            
            // Keyboard shortcuts for mobile testing
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'Enter':
                        if (enterVRBtn.classList.contains('show')) {
                            enterVRBtn.click();
                        }
                        break;
                    case 'Escape':
                        if (scene.is('vr-mode')) {
                            scene.exitVR();
                        }
                        break;
                }
            });
            
        })();
    </script>
</body>
</html>
