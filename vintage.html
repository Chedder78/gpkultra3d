<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GPK Ultra 3D | Vintage Collection 1985</title>
    
    <!-- WebXR and PWA meta tags -->
    <meta name="theme-color" content="#1a1a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GPK Vintage">
    
    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100vw;
            height: 100vh;
            font-family: 'Bangers', cursive, sans-serif;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #ffde37;
            animation: spin 1s linear infinite;
        }
        
        .loading-text {
            color: #ffde37;
            margin-top: 1rem;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        /* Proximity indicator for card interaction */
        #proximity-indicator {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            border: 2px solid #ffde37;
            color: #ffde37;
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 1000;
            display: none;
            text-align: center;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        #proximity-indicator.active {
            display: block;
            animation: pulse 2s infinite;
        }

        /* Back button - only visible when looking down */
        #back-hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            z-index: 1000;
            font-size: 0.8rem;
            pointer-events: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">VINTAGE COLLECTION</div>
    </div>

    <div id="proximity-indicator">
        <span id="proximity-text"></span>
    </div>

    <div id="back-hint">👆 Look down for back button</div>

    <!-- A-Frame Scene - Mobile Walking Experience -->
    <a-scene 
        renderer="colorManagement: true; antialias: false; precision: low; alpha: false"
        background="color: #1a1a1a"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: true"
        embedded
    >
        <!-- Vintage Collection Room -->
        <a-entity geometry="primitive: box; width: 20; height: 5; depth: 20"
                 material="shader: standard; color: #2a2a2a; side: back"
                 position="0 2.5 0">
        </a-entity>
        
        <!-- Floor with markers -->
        <a-entity geometry="primitive: plane; width: 20; height: 20"
                 rotation="-90 0 0"
                 position="0 0 0"
                 material="shader: standard; color: #1a1a1a; metalness: 0.1; roughness: 0.6">
        </a-entity>

        <!-- Navigation grid on floor -->
        <a-entity position="0 0.01 0">
            <a-entity geometry="primitive: plane; width: 20; height: 0.03"
                     rotation="-90 0 0"
                     position="0 0.01 -3"
                     material="shader: standard; color: #333; emissive: #333; emissiveIntensity: 0.3">
            </a-entity>
            <a-entity geometry="primitive: plane; width: 20; height: 0.03"
                     rotation="-90 0 0"
                     position="0 0.01 0"
                     material="shader: standard; color: #333; emissive: #333; emissiveIntensity: 0.3">
            </a-entity>
            <a-entity geometry="primitive: plane; width: 20; height: 0.03"
                     rotation="-90 0 0"
                     position="0 0.01 3"
                     material="shader: standard; color: #333; emissive: #333; emissiveIntensity: 0.3">
            </a-entity>
        </a-entity>
        
        <!-- Warm vintage lighting -->
        <a-entity light="type: ambient; color: #886644; intensity: 0.6"></a-entity>
        <a-entity light="type: directional; color: #FFDE37; intensity: 0.8" position="-3 5 0"></a-entity>
        <a-entity light="type: directional; color: #ff9966; intensity: 0.5" position="3 4 -2"></a-entity>
        <a-entity light="type: point; color: #ffde37; intensity: 1.5; distance: 15" position="0 3 -3"></a-entity>
        
        <!-- Mobile Camera - Device orientation only -->
        <a-entity camera="active: true; fov: 70; near: 0.1; far: 50"
                 look-controls="magicWindowTrackingEnabled: true; touchEnabled: false; mouseEnabled: false"
                 position="0 1.6 4"
                 id="mobile-camera">
            <!-- Gaze cursor -->
            <a-entity cursor="fuse: true; fuseTimeout: 1000"
                     position="0 0 -1"
                     geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
                     material="color: #FFDE37; shader: flat; opacity: 0.8">
            </a-entity>
        </a-entity>
        
        <!-- Back to Hub Zone - Floor portal to return -->
        <a-entity id="back-portal" 
                 position="0 0.02 5"
                 geometry="primitive: circle; radius: 0.5"
                 rotation="-90 0 0"
                 material="shader: standard; color: #ff3e41; emissive: #ff3e41; emissiveIntensity: 0.8; transparent: true; opacity: 0.7">
            <a-entity geometry="primitive: ring; radiusInner: 0.4; radiusOuter: 0.55"
                     rotation="0 0 0"
                     position="0 0.01 0"
                     material="shader: standard; color: #FFDE37; emissive: #FFDE37; emissiveIntensity: 1; transparent: true; opacity: 0.9">
            </a-entity>
            <a-text value="← BACK TO HUB" position="0 0.6 0" color="#ffde37" align="center" width="2"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json">
            </a-text>
        </a-entity>
        
        <!-- Card Gallery Wall 1 - Left Side -->
        <a-entity position="-8 2.5 -2" rotation="0 90 0">
            
            <!-- Card 1: Adam Bomb (Legendary) -->
            <a-entity class="card-display" card-id="1" card-name="Adam Bomb" card-rarity="legendary"
                     position="-3 0 0"
                     geometry="primitive: box; width: 1.2; height: 1.7; depth: 0.1"
                     material="shader: standard; color: #ffde37; emissive: #ffde37; emissiveIntensity: 0.3; metalness: 0.2; roughness: 0.5; transparent: true; opacity: 0.95">
                <a-text value="ADAM BOMB\n#1 Legendary" position="0 1 0.06" color="#FFDE37" align="center" width="1.5"
                        font="https://cdn.aframe.io/fonts/Roboto-msdf.json" scale="0.8 0.8 0.8"></a-text>
                <a-entity class="proximity-glow" geometry="primitive: box; width: 2; height: 2.5; depth: 0.2"
                         position="0 0 -0.1"
                         material="shader: standard; color: #FFDE37; transparent: true; opacity: 0.05; emissive: #FFDE37; emissiveIntensity: 0.1">
                </a-entity>
            </a-entity>
            
            <!-- Card 2: Blasted Billy (Rare) -->
            <a-entity class="card-display" card-id="2" card-name="Blasted Billy" card-rarity="rare"
                     position="0 0 0"
                     geometry="primitive: box; width: 1.2; height: 1.7; depth: 0.1"
                     material="shader: standard; color: #2e86ab; emissive: #2e86ab; emissiveIntensity: 0.2; metalness: 0.2; roughness: 0.5; transparent: true; opacity: 0.95">
                <a-text value="BLASTED BILLY\n#2 Rare" position="0 1 0.06" color="#FFFFFF" align="center" width="1.5"
                        font="https://cdn.aframe.io/fonts/Roboto-msdf.json" scale="0.8 0.8 0.8"></a-text>
                <a-entity class="proximity-glow" geometry="primitive: box; width: 2; height: 2.5; depth: 0.2"
                         position="0 0 -0.1"
                         material="shader: standard; color: #2e86ab; transparent: true; opacity: 0.05; emissive: #2e86ab; emissiveIntensity: 0.1">
                </a-entity>
            </a-entity>
            
            <!-- Card 3: Corroded Carl (Common) -->
            <a-entity class="card-display" card-id="3" card-name="Corroded Carl" card-rarity="common"
                     position="3 0 0"
                     geometry="primitive: box; width: 1.2; height: 1.7; depth: 0.1"
                     material="shader: standard; color: #4caf50; emissive: #4caf50; emissiveIntensity: 0.15; metalness: 0.2; roughness: 0.5; transparent: true; opacity: 0.95">
                <a-text value="CORRODED CARL\n#3 Common" position="0 1 0.06" color="#FFFFFF" align="center" width="1.5"
                        font="https://cdn.aframe.io/fonts/Roboto-msdf.json" scale="0.8 0.8 0.8"></a-text>
                <a-entity class="proximity-glow" geometry="primitive: box; width: 2; height: 2.5; depth: 0.2"
                         position="0 0 -0.1"
                         material="shader: standard; color: #4caf50; transparent: true; opacity: 0.05; emissive: #4caf50; emissiveIntensity: 0.1">
                </a-entity>
            </a-entity>
        </a-entity>
        
        <!-- Card Gallery Wall 2 - Right Side -->
        <a-entity position="8 2.5 -2" rotation="0 -90 0">
            
            <!-- Card 4: Deadly Daphne (Ultra Rare) -->
            <a-entity class="card-display" card-id="4" card-name="Deadly Daphne" card-rarity="ultra-rare"
                     position="-3 0 0"
                     geometry="primitive: box; width: 1.2; height: 1.7; depth: 0.1"
                     material="shader: standard; color: #ff3e41; emissive: #ff3e41; emissiveIntensity: 0.3; metalness: 0.2; roughness: 0.5; transparent: true; opacity: 0.95">
                <a-text value="DEADLY DAPHNE\n#4 Ultra Rare" position="0 1 0.06" color="#FF3E41" align="center" width="1.5"
                        font="https://cdn.aframe.io/fonts/Roboto-msdf.json" scale="0.8 0.8 0.8"></a-text>
                <a-entity class="proximity-glow" geometry="primitive: box; width: 2; height: 2.5; depth: 0.2"
                         position="0 0 -0.1"
                         material="shader: standard; color: #ff3e41; transparent: true; opacity: 0.05; emissive: #ff3e41; emissiveIntensity: 0.1">
                </a-entity>
            </a-entity>
            
            <!-- Card 5: Electric Eric (Common) -->
            <a-entity class="card-display" card-id="5" card-name="Electric Eric" card-rarity="common"
                     position="0 0 0"
                     geometry="primitive: box; width: 1.2; height: 1.7; depth: 0.1"
                     material="shader: standard; color: #ffde37; emissive: #ffde37; emissiveIntensity: 0.15; metalness: 0.2; roughness: 0.5; transparent: true; opacity: 0.95">
                <a-text value="ELECTRIC ERIC\n#5 Common" position="0 1 0.06" color="#FFFFFF" align="center" width="1.5"
                        font="https://cdn.aframe.io/fonts/Roboto-msdf.json" scale="0.8 0.8 0.8"></a-text>
                <a-entity class="proximity-glow" geometry="primitive: box; width: 2; height: 2.5; depth: 0.2"
                         position="0 0 -0.1"
                         material="shader: standard; color: #ffde37; transparent: true; opacity: 0.05; emissive: #ffde37; emissiveIntensity: 0.1">
                </a-entity>
            </a-entity>
            
            <!-- Card 6: Future Card Slot -->
            <a-entity class="card-display" card-id="6" card-name="Coming Soon" card-rarity="unknown"
                     position="3 0 0"
                     geometry="primitive: box; width: 1.2; height: 1.7; depth: 0.1"
                     material="shader: standard; color: #666; metalness: 0.2; roughness: 0.5; transparent: true; opacity: 0.7">
                <a-text value="MORE COMING\nSOON" position="0 1 0.06" color="#999" align="center" width="1.5"
                        font="https://cdn.aframe.io/fonts/Roboto-msdf.json" scale="0.8 0.8 0.8"></a-text>
            </a-entity>
        </a-entity>
        
        <!-- Back Wall - Card Details Display -->
        <a-entity position="0 2.5 -9">
            <a-text value="VINTAGE COLLECTION" position="0 1.5 0.1" color="#FFDE37" align="center" width="5"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" scale="1.2 1.2 1.2"></a-text>
            <a-text value="1985 Original Series" position="0 0.5 0.1" color="#FFFFFF" align="center" width="4"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" scale="0.8 0.8 0.8"></a-text>
            <a-text value="Walk up to cards to view details" position="0 -1 0.1" color="#999" align="center" width="4"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" scale="0.7 0.7 0.7"></a-text>
        </a-entity>
        
        <!-- Card Detail Display (appears when close to a card) -->
        <a-entity id="card-detail-display" position="0 2 -3" visible="false">
            <a-entity geometry="primitive: plane; width: 3; height: 2"
                     material="shader: standard; color: #1a1a1a; metalness: 0.3; roughness: 0.5; transparent: true; opacity: 0.95"
                     position="0 0 0">
            </a-entity>
            <a-text id="detail-card-name" value="" position="0 0.6 0.01" color="#FFDE37" align="center" width="3"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" scale="0.9 0.9 0.9"></a-text>
            <a-text id="detail-card-info" value="" position="0 0 0.01" color="#FFFFFF" align="center" width="2.8"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" scale="0.7 0.7 0.7"></a-text>
            <a-text id="detail-card-artist" value="" position="0 -0.5 0.01" color="#999" align="center" width="2.8"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json" scale="0.6 0.6 0.6"></a-text>
        </a-entity>
        
        <!-- Audio -->
        <a-assets timeout="30000">
            <audio id="click-sound" src="https://cdn.aframe.io/basic-guide/audio/click.ogg"></audio>
            <audio id="hover-sound" src="https://cdn.aframe.io/basic-guide/audio/hover.ogg"></audio>
        </a-assets>
    </a-scene>

    <script>
        (function() {
            'use strict';
            
            const loadingScreen = document.getElementById('loading-screen');
            const proximityIndicator = document.getElementById('proximity-indicator');
            const proximityText = document.getElementById('proximity-text');
            const scene = document.querySelector('a-scene');
            const camera = document.getElementById('mobile-camera');
            const backHint = document.getElementById('back-hint');
            
            // Card database
            const cardDatabase = {
                1: {
                    name: "Adam Bomb",
                    number: "#1",
                    rarity: "Legendary",
                    series: "OS1",
                    description: "The most iconic GPK card. Nuclear explosion!",
                    artist: "John Pound, 1985"
                },
                2: {
                    name: "Blasted Billy",
                    number: "#2",
                    rarity: "Rare",
                    series: "OS1",
                    description: "Blown apart by mysterious explosion.",
                    artist: "John Pound, 1985"
                },
                3: {
                    name: "Corroded Carl",
                    number: "#3",
                    rarity: "Common",
                    series: "OS1",
                    description: "Skin melts to reveal skeleton.",
                    artist: "Tom Bunk, 1985"
                },
                4: {
                    name: "Deadly Daphne",
                    number: "#4",
                    rarity: "Ultra Rare",
                    series: "OS1",
                    description: "Her deadly kiss melts everything.",
                    artist: "John Pound, 1985"
                },
                5: {
                    name: "Electric Eric",
                    number: "#5",
                    rarity: "Common",
                    series: "OS1",
                    description: "Shockingly electrifying personality!",
                    artist: "Tom Bunk, 1985"
                }
            };
            
            // State
            let currentCard = null;
            let isViewingDetail = false;
            let proximityTimeout = null;
            
            // Initialize
            function init() {
                setupProximityDetection();
                setupGazeInteraction();
                setupBackPortal();
                hideLoadingScreen();
                hideBackHint();
            }
            
            // Proximity detection for cards
            function setupProximityDetection() {
                const cards = document.querySelectorAll('.card-display');
                const PROXIMITY_THRESHOLD = 3;
                const INTERACTION_THRESHOLD = 1.5;
                
                function checkProximity() {
                    const cameraPos = camera.getAttribute('position');
                    let closestCard = null;
                    let closestDistance = Infinity;
                    
                    cards.forEach(card => {
                        const cardPos = card.getAttribute('position');
                        // Get world position considering parent
                        const worldPos = getWorldPosition(card);
                        const distance = calculateDistance(cameraPos, worldPos);
                        
                        // Update glow
                        const glowElements = card.querySelectorAll('.proximity-glow');
                        glowElements.forEach(glow => {
                            if (distance < PROXIMITY_THRESHOLD) {
                                const opacity = Math.max(0.02, 0.15 - (distance / PROXIMITY_THRESHOLD) * 0.15);
                                glow.setAttribute('material', 'opacity', opacity);
                                glow.setAttribute('material', 'emissiveIntensity', opacity * 2);
                            } else {
                                glow.setAttribute('material', 'opacity', 0.05);
                                glow.setAttribute('material', 'emissiveIntensity', 0.1);
                            }
                        });
                        
                        if (distance < closestDistance) {
                            closestDistance = distance;
                            closestCard = card;
                        }
                    });
                    
                    // Update proximity indicator
                    if (closestDistance < INTERACTION_THRESHOLD && closestCard) {
                        const cardName = closestCard.getAttribute('card-name');
                        const cardRarity = closestCard.getAttribute('card-rarity');
                        
                        if (!isViewingDetail || currentCard !== closestCard) {
                            proximityText.textContent = `${cardName} - ${cardRarity} - Stare to view`;
                            proximityIndicator.classList.add('active');
                            currentCard = closestCard;
                        }
                    } else if (closestDistance < PROXIMITY_THRESHOLD && closestCard) {
                        const cardName = closestCard.getAttribute('card-name');
                        proximityText.textContent = `${cardName} - Walk closer`;
                        proximityIndicator.classList.add('active');
                        currentCard = null;
                        hideCardDetail();
                    } else {
                        proximityIndicator.classList.remove('active');
                        currentCard = null;
                        hideCardDetail();
                    }
                    
                    // Check back portal proximity
                    checkBackPortalProximity(cameraPos);
                }
                
                setInterval(checkProximity, 200);
            }
            
            // Check back portal proximity
            function checkBackPortalProximity(cameraPos) {
                const portal = document.getElementById('back-portal');
                if (!portal) return;
                
                const portalPos = portal.getAttribute('position');
                const distance = calculateDistance(
                    {x: cameraPos.x, y: 0, z: cameraPos.z},
                    {x: portalPos.x, y: 0, z: portalPos.z}
                );
                
                if (distance < 1.5) {
                    proximityText.textContent = 'Return to main hub - Stare to go back';
                    proximityIndicator.classList.add('active');
                    
                    // Gaze to activate
                    portal.addEventListener('click', () => {
                        window.location.href = 'index.html';
                    });
                }
            }
            
            // Gaze interaction for cards
            function setupGazeInteraction() {
                const cards = document.querySelectorAll('.card-display');
                
                cards.forEach(card => {
                    card.addEventListener('click', () => {
                        if (currentCard === card) {
                            showCardDetail(card);
                        }
                    });
                });
            }
            
            // Show card detail
            function showCardDetail(card) {
                const cardId = card.getAttribute('card-id');
                const cardData = cardDatabase[cardId];
                
                if (!cardData) return;
                
                const detailDisplay = document.getElementById('card-detail-display');
                const detailName = document.getElementById('detail-card-name');
                const detailInfo = document.getElementById('detail-card-info');
                const detailArtist = document.getElementById('detail-card-artist');
                
                detailName.setAttribute('value', `${cardData.name} ${cardData.number}`);
                detailInfo.setAttribute('value', `${cardData.rarity} - ${cardData.description}`);
                detailArtist.setAttribute('value', cardData.artist);
                
                // Position detail display near the card
                const cardWorldPos = getWorldPosition(card);
                detailDisplay.setAttribute('position', {
                    x: cardWorldPos.x,
                    y: cardWorldPos.y,
                    z: cardWorldPos.z + 1.5
                });
                
                detailDisplay.setAttribute('visible', 'true');
                isViewingDetail = true;
                
                // Play sound
                playSound('click-sound', 0.3);
                
                // Auto-hide after 8 seconds
                setTimeout(() => {
                    if (isViewingDetail && currentCard === card) {
                        hideCardDetail();
                    }
                }, 8000);
            }
            
            // Hide card detail
            function hideCardDetail() {
                const detailDisplay = document.getElementById('card-detail-display');
                detailDisplay.setAttribute('visible', 'false');
                isViewingDetail = false;
            }
            
            // Back portal
            function setupBackPortal() {
                const portal = document.getElementById('back-portal');
                
                portal.addEventListener('click', () => {
                    proximityText.textContent = 'Returning to hub...';
                    proximityIndicator.classList.add('active');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                });
            }
            
            // Get world position considering parent transforms
            function getWorldPosition(entity) {
                const pos = entity.getAttribute('position');
                const parent = entity.parentNode;
                
                if (parent && parent.getAttribute('position')) {
                    const parentPos = parent.getAttribute('position');
                    const parentRot = parent.getAttribute('rotation') || {x: 0, y: 0, z: 0};
                    
                    // Simple rotation around Y axis
                    const rad = (parentRot.y * Math.PI) / 180;
                    const cos = Math.cos(rad);
                    const sin = Math.sin(rad);
                    
                    return {
                        x: parentPos.x + (pos.x * cos - pos.z * sin),
                        y: parentPos.y + pos.y,
                        z: parentPos.z + (pos.x * sin + pos.z * cos)
                    };
                }
                
                return pos;
            }
            
            // Calculate 3D distance
            function calculateDistance(pos1, pos2) {
                const dx = pos1.x - pos2.x;
                const dy = pos1.y - pos2.y;
                const dz = pos1.z - pos2.z;
                return Math.sqrt(dx * dx + dy * dy + dz * dz);
            }
            
            // Play sound
            function playSound(soundId, volume = 0.5) {
                const soundEl = document.getElementById(soundId);
                if (soundEl) {
                    const clone = soundEl.cloneNode();
                    clone.volume = volume;
                    clone.play().catch(() => {});
                }
            }
            
            // Hide back hint after delay
            function hideBackHint() {
                setTimeout(() => {
                    backHint.style.opacity = '0';
                    backHint.style.transition = 'opacity 1s ease';
                }, 5000);
            }
            
            // Hide loading
            function hideLoadingScreen() {
                scene.addEventListener('loaded', () => {
                    setTimeout(() => {
                        loadingScreen.style.opacity = '0';
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                        }, 500);
                    }, 1000);
                });
            }
            
            // Initialize
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
            
        })();
    </script>
</body>
</html>
